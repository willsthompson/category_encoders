[project]
name = "dlt-csv-postgres-pipeline"
version = "0.1.0"
description = "A dlt pipeline that loads CSV/Excel files into PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "dlt[postgres]>=0.4.0",
    "openpyxl>=3.0.0",
    "pyarrow>=14.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-postgresql>=6.0",
    "psycopg>=3.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.0",
]
codegen = [
    "openapi-python-client>=0.21.0",
]
